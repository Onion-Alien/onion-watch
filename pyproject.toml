[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onionwatch"
dynamic = ["version"]
description = "Plays a sound when something shows up in a game window, even while you're alt-tabbed away"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE"]
dependencies = [
    "PySide6==6.11.2",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "soxr==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "pyinstaller==6.22.3"]

[project.gui-scripts]
onionwatch = "onionwatch.app:main"

[tool.setuptools.packages.find]
include = ["onionwatch*"]

[tool.setuptools.dynamic]
version = { attr = "onionwatch.__version__" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "B", "BLE", "UP"]
ignore = [
    "E731",   # lambda assignment: used deliberately for tiny local helpers
    "B008",   # function call in default arg (Qt enums)
    "B905",   # zip(strict=): the zips here are over fixed-size parallel tuples
]

[tool.ruff.lint.per-file-ignores]
"onionwatch/theme.py" = ["E501"]   # the stylesheet is one rule per line
"tests/*" = ["BLE"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
