# Keeps the pinned dependencies current, as Onion Board's.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Pins (==) still get bumped; ranges like setuptools>=77 are left alone
    # while the newest release already satisfies them.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
