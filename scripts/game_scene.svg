<!-- The made-up game in the screenshots: the same scene as the website's Watch demo
     (onion-board docs/index.html). The rare one shows up with a name on the plate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200">
  <defs>
    <linearGradient id="gw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f33"/><stop offset=".5" stop-color="#33225e"/>
      <stop offset=".78" stop-color="#7a3f6e"/><stop offset="1" stop-color="#c0646a"/>
    </linearGradient>
    <radialGradient id="gw-moon"><stop offset="0" stop-color="#fff3d1" stop-opacity=".55"/><stop offset="1" stop-color="#fff3d1" stop-opacity="0"/></radialGradient>
    <radialGradient id="gw-portal"><stop offset="0" stop-color="#b9fff4"/><stop offset=".45" stop-color="#4fd8c6"/><stop offset="1" stop-color="#1b5e6e"/></radialGradient>
    <radialGradient id="gw-halo"><stop offset="0" stop-color="#5fe0cf" stop-opacity=".5"/><stop offset="1" stop-color="#5fe0cf" stop-opacity="0"/></radialGradient>
    <radialGradient id="gw-lamp"><stop offset="0" stop-color="#ffd27a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="460" height="200" fill="url(#gw-sky)"/>
  <g class="stars" fill="#fff">
    <circle cx="30" cy="22" r="1.1"/><circle cx="74" cy="44" r=".8"/><circle cx="118" cy="16" r="1.3"/>
    <circle cx="166" cy="38" r=".8"/><circle cx="208" cy="12" r="1"/><circle cx="262" cy="30" r=".8"/>
    <circle cx="300" cy="14" r="1.2"/><circle cx="338" cy="52" r=".7"/><circle cx="436" cy="24" r="1.1"/>
    <circle cx="420" cy="70" r=".7"/><circle cx="12" cy="64" r=".8"/><circle cx="96" cy="76" r=".6"/>
  </g>
  <circle cx="388" cy="40" r="46" fill="url(#gw-moon)"/>
  <circle cx="388" cy="40" r="17" fill="#fff3d1"/>
  <circle cx="382" cy="35" r="3.5" fill="#efdcae"/><circle cx="393" cy="46" r="2.4" fill="#efdcae"/><circle cx="394" cy="32" r="1.6" fill="#efdcae"/>
  <!-- far mountains, then nearer, each a little darker -->
  <path d="M0 132L34 104L58 118L96 82L128 112L160 96L200 124L240 100L272 116L310 88L350 116L392 94L430 112L460 98V200H0Z" fill="#59377a" opacity=".85"/>
  <path d="M96 82L104 91L98 90L92 95L88 89Z M310 88L318 97L312 96L306 101L302 95Z" fill="#a98ac9" opacity=".55"/>
  <path d="M0 146L40 126L80 138L126 118L170 136L214 128L262 140L300 122L346 134L392 120L460 136V200H0Z" fill="#3a2659"/>
  <!-- the castle on the hill -->
  <g class="castle">
    <path d="M318 124V96H314V88H319V92H323V88H328V92H332V88H337V96H333V112H352V100H348V93H353V97H357V93H362V97H366V93H371V100H367V126Z" fill="#241938" stroke="#120c22" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M327 102h4v7h-4z M357 104h4v6h-4z M341 114h5v12h-5z" fill="#ffc95a"/>
    <circle cx="329" cy="105" r="9" fill="url(#gw-lamp)"/><circle cx="359" cy="107" r="8" fill="url(#gw-lamp)"/>
    <path d="M325 88V78" stroke="#120c22" stroke-width="1.4"/><path d="M325 78L334 81L325 84Z" fill="#ff5c8a"/>
  </g>
  <path d="M0 160C60 146 110 152 160 150C220 148 260 142 320 150C380 157 420 148 460 152V200H0Z" fill="#251a45"/>
  <!-- pines -->
  <g fill="#140e28" stroke="#0b0818" stroke-width="1" stroke-linejoin="round">
    <path d="M22 168L36 120L50 168Z"/><path d="M26 146L36 110L46 146Z"/>
    <path d="M48 170L60 132L72 170Z"/><path d="M4 172L14 140L24 172Z"/>
    <path d="M412 170L426 118L440 170Z"/><path d="M416 146L426 108L436 146Z"/>
    <path d="M438 172L450 136L462 172Z"/><path d="M392 172L402 146L412 172Z"/>
  </g>
  <!-- the ground -->
  <path d="M0 172C80 164 150 168 230 166C320 164 390 168 460 166V200H0Z" fill="#1a1330"/>
  <path d="M150 200C180 186 210 176 230 172C250 176 280 186 310 200Z" fill="#2a2046"/>
  <g stroke="#3d2f63" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M84 172l2-5m2 5l-1-6M376 171l2-5m2 5l-1-6M120 182l2-5m2 5l-1-6M340 186l2-5m2 5l-1-6"/>
  </g>
  <!-- the stone arch with a portal in it -->
  <circle class="halo" cx="230" cy="140" r="52" fill="url(#gw-halo)"/>
  <g stroke="#120c22" stroke-width="2" stroke-linejoin="round">
    <path d="M200 172V128Q200 100 230 100Q260 100 260 128V172H250V130Q250 112 230 112Q210 112 210 130V172Z" fill="#5d5480"/>
    <ellipse class="portal" cx="230" cy="143" rx="19" ry="29" fill="url(#gw-portal)" stroke="none"/>
    <path d="M196 174h18v-6h-18zM246 174h18v-6h-18z" fill="#4a4268"/>
    <path d="M224 100h12l-2 8h-8z" fill="#7a70a3"/>
  </g>
  <path d="M205 120l3 3M254 124l-3 4M207 150h3M250 156h3" stroke="#3e3660" stroke-width="1.4" stroke-linecap="round"/>
  <!-- the name plate the trigger watches: a rare one's name shows up here -->
  <g class="plate">
    <path d="M152 42h156M152 42l-6 -8M308 42l6 -8" stroke="#8f7fb8" stroke-width="1.4" fill="none" opacity=".6"/>
    <rect x="150" y="44" width="160" height="30" rx="7" fill="#100b22" fill-opacity=".72" stroke="#6f5fa0" stroke-width="1.4"/>
    <g class="runes" fill="#6f5fa0"><circle cx="214" cy="59" r="2"/><circle cx="230" cy="59" r="2"/><circle cx="246" cy="59" r="2"/></g>
  </g>
  <!-- the rare one: only out for RARE SPAWN -->
  <g class="rare">
    <ellipse cx="230" cy="171" rx="20" ry="3.5" fill="#000" opacity=".35"/>
    <path d="M212 170Q210 146 230 142Q250 146 248 170Z" fill="#ffd45e" stroke="#2b2340" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M222 148Q228 145 233 147" stroke="#fff6cf" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="224" cy="158" rx="2.4" ry="3.2" fill="#2b2340"/><ellipse cx="236" cy="158" rx="2.4" ry="3.2" fill="#2b2340"/>
    <path d="M227 164Q230 167 233 164" stroke="#2b2340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M226 136l4-8 4 8-4-2z" fill="#ffe9a0" stroke="#2b2340" stroke-width="1.4" stroke-linejoin="round"/>
    <g class="sparks" fill="#fff6cf"><path d="M206 146l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z"/>
      <path d="M254 140l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z"/></g>
  </g>
  <!-- you: a little knight -->
  <g class="knight">
    <g class="kb">
      <ellipse cx="128" cy="177" rx="15" ry="3" fill="#000" opacity=".4"/>
      <g stroke="#2b2340" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M118 150Q110 166 114 174L126 170Z" fill="#ff5c8a"/>
        <rect x="121" y="166" width="5" height="10" rx="2" fill="#3a3452"/>
        <rect x="130" y="166" width="5" height="10" rx="2" fill="#3a3452"/>
        <path d="M117 168Q116 150 128 148Q140 150 139 168Z" fill="#7c5cff"/>
        <path d="M120 160h16" stroke="#ffcf40" stroke-width="2.4"/>
        <g class="sword"><path d="M142 158L156 134" stroke="#2b2340" stroke-width="5"/><path d="M142 158L156 134" stroke="#e8ecf5" stroke-width="2.6"/>
          <path d="M138 154l8 5" stroke="#ffcf40" stroke-width="3"/></g>
        <circle cx="140" cy="158" r="3" fill="#fbf7f2"/>
        <circle cx="114" cy="160" r="7" fill="#4fc3b0"/><path d="M114 155v10M109 160h10" stroke="#2f9c8c" stroke-width="1.6"/>
        <circle cx="128" cy="138" r="12" fill="#c9cede"/>
        <path d="M119 137h18v5q-9 3-18 0z" fill="#2b2340"/>
        <path d="M128 126q2-10 10-12q-2 8-6 13" fill="#ffcf40"/>
      </g>
      <g class="eyes" fill="#ffe08a"><circle cx="124" cy="139.5" r="1.6"/><circle cx="132" cy="139.5" r="1.6"/></g>
    </g>
  </g>
  <!-- fireflies -->
  <g class="flies" fill="#ffe9a0">
    <circle cx="96" cy="150" r="1.6"/><circle cx="176" cy="132" r="1.3"/><circle cx="292" cy="146" r="1.6"/>
    <circle cx="352" cy="158" r="1.2"/><circle cx="66" cy="132" r="1.2"/>
  </g>
</svg>
